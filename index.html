<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎬 Режиссёрский сценарий</title>
<style>
:root {
  --bg:#0a0a0a; --card:#121212; --border:#202020;
  --accent:#e94560; --gold:#f0a500; --green:#4ecca3;
  --text:#ddd; --muted:#777; --input:#161616;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:13px;-webkit-tap-highlight-color:transparent}

/* TOOLBAR */
.tb{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tb h1{font-size:14px;font-weight:800;margin-right:auto}
.tb select.project{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;min-width:140px;outline:none;cursor:pointer}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:active{background:#222}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#000}
.btn.s{padding:4px 7px;font-size:10px}
.btn.danger{color:var(--accent);border-color:var(--accent)}

/* CREW */
.crew{padding:10px 12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crew label{font-size:10px;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.crew input{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;width:140px;outline:none}
.crew input:focus{border-color:var(--accent)}

/* Size controls */
.sz{padding:4px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sz span{font-size:10px;color:var(--muted)}
.sz input[type=range]{width:80px;accent-color:var(--accent)}

/* TABLE */
.twrap{position:relative;margin:0 8px 8px;max-height:calc(100vh - 170px);overflow:auto;border:1px solid var(--border);border-radius:4px}
table{border-collapse:collapse;min-width:max-content;font-size:var(--fs,11px);width:100%}
thead{position:sticky;top:0;z-index:10}
th,td{border:1px solid var(--border);text-align:left;vertical-align:top;position:relative}
th{font-size:9px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;background:var(--card);color:var(--muted);padding:4px 6px;overflow:hidden}
td{padding:0}

/* Resize handles */
.resize-r{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.resize-b{position:absolute;bottom:-3px;left:0;right:0;height:8px;cursor:row-resize;z-index:6}
.resize-b:hover{background:rgba(233,69,96,0.3)}

/* Cell inputs - fill entire cell */
td.data{height:36px}
.cell-txt,.cell-sel{width:100%;height:100%;padding:3px 5px;background:transparent;border:none;color:var(--text);font-size:var(--fs,11px);font-family:inherit;outline:none;display:block;line-height:1.3;margin:0}
.cell-txt{resize:none;min-height:36px;overflow-wrap:break-word;white-space:pre-wrap}
.cell-sel{appearance:none;cursor:pointer;color:var(--text);background:var(--input);border-radius:0;min-height:28px}
.cell-sel option{color:#000;background:#fff}
.cell-txt:focus,.cell-sel:focus{outline:1px solid var(--accent);outline-offset:-1px;z-index:2;position:relative}

td.num{text-align:center;font-weight:800;font-size:var(--fs,11px);color:var(--accent);width:28px;padding:3px 2px}
td.chk{width:22px;text-align:center;vertical-align:middle}
td.chk>input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);margin:0}
td.act{width:52px;text-align:center;vertical-align:middle;padding:2px}
td.act button{padding:2px 5px;border-radius:3px;border:1px solid var(--border);background:var(--input);color:var(--muted);cursor:pointer;font-size:9px;margin:1px}
td.act button:active{color:var(--accent)}

/* Colors */
tr.ie-int-night td{background:rgba(10,10,40,0.45)}
tr.ie-int-day td{background:rgba(18,40,18,0.35)}
tr.ie-ext-night td{background:rgba(5,10,40,0.55)}
tr.ie-ext-day td{background:rgba(40,25,10,0.35)}
tr.selected td{background:rgba(233,69,96,0.18)!important}

/* SB */
td.sb-cell{padding:3px;vertical-align:top}
.sb-wrap{height:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sb-zone{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden;min-height:0}
.sb-slot{flex:1 1 0%;min-height:30px;width:100%;border:2px dashed var(--border);border-radius:6px;background:var(--input);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;position:relative;transition:.15s}
.sb-slot img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.sb-slot.drag-over{border-color:var(--accent);background:rgba(233,69,96,0.1)}
.sb-slot .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center}
.sb-slot.has-img:hover .del,.sb-slot.has-img .del{display:flex}
.sb-slot.sb-new{min-height:30px;border-style:dotted;flex:0 0 auto}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:200;cursor:pointer}
.modal img{max-width:95vw;max-height:95vh;border-radius:8px}

/* Print */
@media print{
  body{background:#fff;color:#000;font-size:9px}
  .tb,.crew,.sz,.act,.chk,.del,.sb-zone,.btn,.resize-r,.resize-b{display:none!important}
  .twrap{max-height:none;overflow:visible;border:none;margin:0}
  table{font-size:9px;width:100%}
  th,td{border-color:#000;color:#000;padding:2px 4px}
  th{background:#eee;padding:2px 4px}
  td.data{height:auto}
  .cell-inp,.cell-txt,.cell-sel{color:#000;font-size:9px;min-height:auto;padding:0;height:auto}
  tr td{background:transparent!important}
  td.sb-cell{min-width:60px;width:80px;padding:2px}
  .sb-slot{min-height:30px;font-size:14px}
  @page{margin:8mm;size:A4 landscape}
}
</style>
</head>
<body>

<div class="tb">
  <h1>🎬 Сценарий</h1>
  <select class="project" id="projSel"></select>
  <button class="btn s" onclick="renameProject()" title="Переименовать">✏️</button>
  <button class="btn danger s" onclick="deleteProject()" title="Удалить">🗑</button>
  <button class="btn a" onclick="addRow()">+ Строка</button>
  <button class="btn" onclick="addRows(3)">+3</button>
  <button class="btn" onclick="addRows(10)">+10</button>
  <button class="btn s" onclick="newProject()">🆕 Проект</button>
  <button class="btn g" onclick="exportCSV()">📥 CSV</button>
  <button class="btn s" onclick="exportJSON()">💾 JSON</button>
  <label class="btn s" style="cursor:pointer">📂 <input type="file" accept=".csv,.json" style="display:none" onchange="loadFile(this)"></label>
  <button class="btn s" onclick="window.print()">🖨️</button>
  <button class="btn danger s" onclick="delSelected()" id="delSel" style="display:none"></button>
  <span id="cnt" style="font-size:11px;color:var(--muted);margin-left:4px"></span>
</div>

<div class="crew">
  <label>Режиссёр <input id="crDir" placeholder="Хахуза" oninput="saveMeta()"></label>
  <label>Оператор <input id="crOp" placeholder="Ярослав Савельев" oninput="saveMeta()"></label>
  <label>Продюсер <input id="crProd" placeholder="" oninput="saveMeta()"></label>
</div>

<div class="sz">
  <span>Шрифт:</span><input type="range" min="8" max="20" value="11" id="fontSz" oninput="setFont(this.value)">
  <span id="fontVal">11px</span>
  <span style="margin-left:12px">Высота строк по умолчанию:</span><input type="range" min="24" max="400" value="36" id="defRowH" oninput="setDefRowH(this.value)">
  <span id="defRowHVal">36px</span>
</div>

<div class="twrap" id="twrap">
  <table>
    <thead><tr id="theadRow">
      <th style="width:22px;min-width:22px"></th>
      <th style="width:28px;min-width:28px">#</th>
      <th>SHOT</th><th>Инт/Нат</th><th>Время</th><th>Кадр</th><th>Субъект</th><th>Угол</th><th>Линза</th><th>Оборуд.</th><th>Камера</th>
      <th>Действие</th><th>Заметки</th><th>Заметки ОПЕР</th><th>Текст</th><th>Тайминг</th><th>Локация</th><th>🎬 Раскадровка</th><th></th>
    </tr></thead>
    <tbody id="tBody"></tbody>
  </table>
</div>

<script>
var FIELDS = ['shotNo','interior','timeOfDay','frame','subject','angle','lens','equipment','cameraMove','action','notes','opNotes','text','timing','location'];
var SEL = {
  interior:['интерьер','натура'],
  timeOfDay:['утро','день','вечер','ночь'],
  equipment:['РУКИ','ШТАТИВ','Слайдер','Стабилизатор','Стедикам','Кран','Дрон','ГРИП']
};
var TXT = {shotNo:1,interior:0,timeOfDay:0,frame:1,subject:1,angle:1,lens:1,equipment:0,cameraMove:1,action:1,notes:1,opNotes:1,text:1,timing:1,location:1};
var COL_IDX = {chk:0,num:1,shotNo:2,interior:3,timeOfDay:4,frame:5,subject:6,angle:7,lens:8,equipment:9,cameraMove:10,action:11,notes:12,opNotes:13,text:14,timing:15,location:16,sb:17,act:18};

function rowIE(r) {
  var i=(r.interior||'').toLowerCase(), t=(r.timeOfDay||'').toLowerCase();
  if(i.includes('интерьер')&&(t.includes('ноч')||t.includes('веч')))return'ie-int-night';
  if(i.includes('интерьер')&&t.includes('ден'))return'ie-int-day';
  if(i.includes('натура')&&(t.includes('ноч')||t.includes('веч')))return'ie-ext-night';
  if(i.includes('натура')&&t.includes('ден'))return'ie-ext-day';
  if(i.includes('интерьер'))return'ie-int-day';
  if(i.includes('натура'))return'ie-ext-day';
  if(t.includes('ноч')||t.includes('веч'))return'ie-int-night';
  return'';
}

var projects={}, currentProj='default', rows=[], nextId=1, meta={director:'',operator:'',producer:''}, selectedRows={}, fontSize=11, defRowH=36, colSizes={}, rowHeights={};

// ===== STORAGE =====
function saveAll(){ localStorage.setItem('ds_proj',JSON.stringify(projects)); localStorage.setItem('ds_cur',currentProj); localStorage.setItem('ds_fs',fontSize); localStorage.setItem('ds_rh',defRowH); }
function loadAll(){
  var p=localStorage.getItem('ds_proj'); if(p)projects=JSON.parse(p);
  currentProj=localStorage.getItem('ds_cur')||'default';
  fontSize=parseInt(localStorage.getItem('ds_fs'))||11;
  defRowH=parseInt(localStorage.getItem('ds_rh'))||36;
  if(!projects[currentProj])projects[currentProj]={rows:[],nextId:1,meta:{director:'',operator:'',producer:''}};
}
function loadProject(){
  var p=projects[currentProj]; rows=p.rows||[]; nextId=p.nextId||1;
  meta=p.meta||{director:'',operator:'',producer:''};
  colSizes=p.colSizes||{}; rowHeights=p.rowHeights||{};
  document.getElementById('crDir').value=meta.director||'';
  document.getElementById('crOp').value=meta.operator||'';
  document.getElementById('crProd').value=meta.producer||'';
  document.getElementById('fontSz').value=fontSize;
  document.getElementById('fontVal').textContent=fontSize+'px';
  document.getElementById('defRowH').value=defRowH;
  document.getElementById('defRowHVal').textContent=defRowH+'px';
  document.documentElement.style.setProperty('--fs',fontSize+'px');
}
function saveProject(){ projects[currentProj]={rows:rows,nextId:nextId,meta:meta,colSizes:colSizes,rowHeights:rowHeights}; saveAll(); }

function switchProject(name){ if(name==='__new__'){newProject();return;} currentProj=name; localStorage.setItem('ds_cur',name); loadProject(); selectedRows={}; render(); updateProjectSelector(); }
function newProject(){ var n=prompt('Название:'); if(!n)return; if(projects[n]){alert('Уже есть');return;} projects[n]={rows:[],nextId:1,meta:{director:'',operator:'',producer:''},colSizes:{},rowHeights:{}}; currentProj=n; localStorage.setItem('ds_cur',n); loadProject(); selectedRows={}; render(); updateProjectSelector(); }
function renameProject(){ var o=currentProj,n=prompt('Новое название:',o); if(!n||n===o)return; if(projects[n]){alert('Уже есть');return;} projects[n]=projects[o]; delete projects[o]; currentProj=n; localStorage.setItem('ds_cur',n); saveAll(); updateProjectSelector(); }
function deleteProject(){ var k=Object.keys(projects); if(k.length<=1){alert('Нельзя удалить последний');return;} if(!confirm('Удалить «'+currentProj+'»?'))return; delete projects[currentProj]; currentProj=k.find(function(x){return x!==currentProj;}); localStorage.setItem('ds_cur',currentProj); saveAll(); loadProject(); selectedRows={}; render(); updateProjectSelector(); }
function updateProjectSelector(){ var s=document.getElementById('projSel'); s.innerHTML=''; Object.keys(projects).forEach(function(k){s.innerHTML+='<option value="'+k+'"'+(k===currentProj?' selected':'')+'>'+k+'</option>';}); s.innerHTML+='<option value="__new__" style="color:var(--accent)">+ Новый проект</option>'; }
document.getElementById('projSel').addEventListener('change',function(){switchProject(this.value);});

function saveMeta(){ meta.director=document.getElementById('crDir').value; meta.operator=document.getElementById('crOp').value; meta.producer=document.getElementById('crProd').value; saveProject(); }
function setFont(v){ fontSize=parseInt(v); document.getElementById('fontVal').textContent=v+'px'; document.documentElement.style.setProperty('--fs',v+'px'); saveAll(); }
function setDefRowH(v){ defRowH=parseInt(v); document.getElementById('defRowHVal').textContent=v+'px'; render(); saveAll(); }

// ===== RENDER =====
function render(){
  var h='';
  rows.forEach(function(r,i){
    var cls=rowIE(r); if(selectedRows[r.id])cls+=' selected';
    var rh=rowHeights[r.id]||defRowH;
    var rhpx='height:'+rh+'px';
    h+='<tr class="'+cls+'" id="r-'+r.id+'">';
    // checkbox + row resize
    h+='<td class="chk" style="'+rhpx+'"><input type="checkbox" onchange="sel('+r.id+',event)"'+(selectedRows[r.id]?' checked':'')+'>';
    h+='<div class="resize-b" onmousedown="rowRS(event,'+r.id+')"></div></td>';
    // num
    h+='<td class="num" style="'+rhpx+'">'+(i+1)+'<div class="resize-b" onmousedown="rowRS(event,'+r.id+')"></div></td>';
    // data cells
    FIELDS.forEach(function(f){
      var v=r[f]||'',cs=colSizes[f]?'width:'+colSizes[f]+'px;':'';
      var rb = '<div class="resize-b" onmousedown="rowRS(event,'+r.id+')"></div>';
      if(SEL[f]){
        var o='<option value="">—</option>'; SEL[f].forEach(function(x){o+='<option value="'+x+'"'+(x===v?' selected':'')+'>'+x+'</option>';});
        h+='<td class="data" style="'+rhpx+cs+'"><select class="cell-sel" onchange="upd('+r.id+',\''+f+'\',this.value);recolor('+r.id+')">'+o+'</select>'+rb+'<div class="resize-r" onmousedown="colRS(event,\''+f+'\')"></div></td>';
      }else{
        h+='<td class="data" style="'+rhpx+cs+'"><textarea class="cell-txt" onchange="upd('+r.id+',\''+f+'\',this.value)" style="min-height:'+rh+'px">'+esc(v)+'</textarea>'+rb+'<div class="resize-r" onmousedown="colRS(event,\''+f+'\')"></div></td>';
      }
    });
    // SB
    var sbW=colSizes.sb?'width:'+colSizes.sb+'px;':'';
    h+='<td class="sb-cell" style="'+rhpx+sbW+'"><div class="sb-wrap" style="max-height:'+rh+'px"><div class="sb-zone">';
    var sbs=(r.storyboard||[]).filter(function(x){return!!x;});
    if(sbs.length===0)sbs=[''];
    sbs.forEach(function(img,si){
      h+='<div class="sb-slot'+(img?' has-img':'')+'" id="sb-'+r.id+'-'+si+'" ondragover="dOver(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dDrop(event,'+r.id+','+si+')">';
      if(img){ h+='<img src="'+img+'" onclick="viewImg(event,\''+img+'\')"><button class="del" onclick="event.stopPropagation();delSB('+r.id+','+si+')">✕</button>'; }
      else h+='<span onclick="addSB('+r.id+','+si+')">+</span>';
      h+='</div>';
    });
    h+='<div class="sb-slot sb-new" ondragover="dOver(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dDropNew(event,'+r.id+')"><span onclick="addSBNew('+r.id+')">+</span></div>';
    h+='</div></div><div class="resize-b" onmousedown="rowRS(event,'+r.id+')"></div><div class="resize-r" onmousedown="colRS(event,\'sb\')"></div></td>';
    // actions
    h+='<td class="act" style="'+rhpx+'"><button onclick="dup('+i+')">⧉</button><button style="color:var(--accent)" onclick="del('+i+')">✕</button><div class="resize-b" onmousedown="rowRS(event,'+r.id+')"></div></td>';
    h+='</tr>';
  });
  document.getElementById('tBody').innerHTML=h;
  document.getElementById('cnt').textContent=rows.length+' сцен';
  // apply col widths to header
  for(var ci in COL_IDX){ var w=colSizes[ci]; if(w){ var th=document.querySelectorAll('#theadRow th')[COL_IDX[ci]]; if(th){th.style.width=w+'px';th.style.minWidth=w+'px';} } }
  updateDelSel();
}

function recolor(id){ var r=rows.find(function(x){return x.id===id;}),tr=document.getElementById('r-'+id); if(r&&tr)tr.className=rowIE(r)+(selectedRows[id]?' selected':''); }
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===== RESIZE =====
var rez=null,rezS=0,rezSz=0;
function colRS(e,fk){ e.preventDefault(); e.stopPropagation(); rez={t:'col',k:fk}; rezS=e.clientX; var i=COL_IDX[fk],th=document.querySelectorAll('#theadRow th')[i]; rezSz=th?th.offsetWidth:(colSizes[fk]||80); document.addEventListener('mousemove',reMove); document.addEventListener('mouseup',reEnd); }
function rowRS(e,rid){ e.preventDefault(); e.stopPropagation(); rez={t:'row',id:rid}; rezS=e.clientY; var tr=document.getElementById('r-'+rid); rezSz=tr?tr.offsetHeight:(rowHeights[rid]||defRowH); document.addEventListener('mousemove',reMove); document.addEventListener('mouseup',reEnd); }
function reMove(e){
  if(!rez)return;
  if(rez.t==='col'){ var nw=Math.max(30,rezSz+e.clientX-rezS); colSizes[rez.k]=nw; var i=COL_IDX[rez.k],th=document.querySelectorAll('#theadRow th')[i]; if(th){th.style.width=nw+'px';th.style.minWidth=nw+'px';} document.querySelectorAll('#tBody td.data:nth-child('+(i+1)+'),#tBody td.sb-cell:nth-child('+(i+1)+')').forEach(function(x){x.style.width=nw+'px';}); }
  else{ var nh=Math.max(24,rezSz+e.clientY-rezS); rowHeights[rez.id]=nh; var tr=document.getElementById('r-'+rez.id); if(tr){tr.style.height=nh+'px'; tr.querySelectorAll('td').forEach(function(x){x.style.height=nh+'px';}); tr.querySelectorAll('.cell-txt').forEach(function(x){x.style.minHeight=nh+'px';});} }
}
function reEnd(){ if(rez)saveProject(); rez=null; document.removeEventListener('mousemove',reMove); document.removeEventListener('mouseup',reEnd); }

// ===== ROWS =====
function addRow(){ var r={id:nextId++,storyboard:[]}; FIELDS.forEach(function(f){r[f]='';}); rows.push(r); render(); var el=document.getElementById('r-'+r.id); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); saveProject(); }
function addRows(n){for(var i=0;i<n;i++)addRow();}
function upd(id,k,v){var r=rows.find(function(x){return x.id===id;});if(r){r[k]=v;saveProject();}}
function del(i){if(!confirm('Удалить строку #'+(i+1)+'?'))return; delete selectedRows[rows[i].id]; delete rowHeights[rows[i].id]; rows.splice(i,1);render();saveProject();}
function dup(i){var r=JSON.parse(JSON.stringify(rows[i]));r.id=nextId++;rows.splice(i+1,0,r);render();saveProject();}

// ===== MULTI-SELECT =====
function sel(id,e){if(e.target.checked)selectedRows[id]=true;else delete selectedRows[id];render();}
function delSelected(){var ids=Object.keys(selectedRows);if(!ids.length)return;if(!confirm('Удалить '+ids.length+' строк?'))return;rows=rows.filter(function(r){return!selectedRows[r.id];});selectedRows={};render();saveProject();}
function updateDelSel(){var b=document.getElementById('delSel'),n=Object.keys(selectedRows).length;b.style.display=n>0?'':'none';b.textContent='✕ '+n;}

// ===== SB =====
function addSB(id,si){pickImg(function(u){saveSB(id,si,u);});}
function addSBNew(id){pickImg(function(u){addSBSlot(id,u);});}
function pickImg(cb){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var f=i.files[0];if(f)procImg(f,cb);};i.click();}
function procImg(f,cb){if(f.size>800000){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var w=img.width,h=img.height,ra=Math.min(800/w,800/h);w=Math.round(w*ra);h=Math.round(h*ra);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(f);}else{var fr=new FileReader();fr.onload=function(e){cb(e.target.result);};fr.readAsDataURL(f);}}
function saveSB(id,si,u){var r=rows.find(function(x){return x.id===id;});if(!r)return;if(!r.storyboard)r.storyboard=[];r.storyboard=r.storyboard.filter(function(x){return!!x;});if(si>=r.storyboard.length)r.storyboard.push(u);else r.storyboard[si]=u;render();saveProject();}
function addSBSlot(id,u){var r=rows.find(function(x){return x.id===id;});if(!r)return;if(!r.storyboard)r.storyboard=[];r.storyboard=r.storyboard.filter(function(x){return!!x;});r.storyboard.push(u);render();saveProject();}
function delSB(id,si){var r=rows.find(function(x){return x.id===id;});if(!r||!r.storyboard)return;r.storyboard=r.storyboard.filter(function(x){return!!x;});r.storyboard.splice(si,1);render();saveProject();}
function viewImg(e,u){e.stopPropagation();var m=document.createElement('div');m.className='modal';m.innerHTML='<img src="'+u+'">';m.onclick=function(){m.remove();};document.body.appendChild(m);}
function dOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dDrop(e,id,si){e.preventDefault();e.currentTarget.classList.remove('drag-over');var f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('image/'))return;procImg(f,function(u){saveSB(id,si,u);});}
function dDropNew(e,id){e.preventDefault();e.currentTarget.classList.remove('drag-over');var f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('image/'))return;procImg(f,function(u){addSBSlot(id,u);});}

// ===== IMPORT/EXPORT =====
function exportCSV(){
  var hdr=['SHOT','Инт/Нат','Время суток','Кадр','Субъект','Угол','Линза','Оборудование','Камера','Действие','Заметки','Заметки ОПЕР','Текст','Тайминг','Локация'];
  var map=['shotNo','interior','timeOfDay','frame','subject','angle','lens','equipment','cameraMove','action','notes','opNotes','text','timing','location'];
  var lines=[hdr.join(',')];
  rows.forEach(function(r){ lines.push(map.map(function(f){return'"'+(r[f]||'').replace(/"/g,'""')+'"';}).join(',')); });
  dl('\uFEFF'+lines.join('\n'),currentProj+'.csv','text/csv');
}
function exportJSON(){ dl(JSON.stringify({project:currentProj,meta:meta,rows:rows,colSizes:colSizes,rowHeights:rowHeights},null,2),currentProj+'.json','application/json'); }
function dl(c,n,t){var b=new Blob([c],{type:t}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();}

function loadFile(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(e){
    if(f.name.endsWith('.json')){
      var d=JSON.parse(e.target.result);
      if(d.project&&d.project!==currentProj){if(confirm('Импортировать как проект "'+d.project+'"?')){projects[d.project]={rows:d.rows||[],nextId:Math.max.apply(null,(d.rows||[]).map(function(x){return x.id}).concat([0]))+1,meta:d.meta||{},colSizes:d.colSizes||{},rowHeights:d.rowHeights||{}};currentProj=d.project;localStorage.setItem('ds_cur',d.project);loadProject();selectedRows={};render();updateProjectSelector();saveAll();return;}}
      meta=d.meta||{};document.getElementById('crDir').value=meta.director||'';document.getElementById('crOp').value=meta.operator||'';document.getElementById('crProd').value=meta.producer||'';
      rows=d.rows||[];colSizes=d.colSizes||{};rowHeights=d.rowHeights||{};nextId=Math.max.apply(null,rows.map(function(x){return x.id}).concat([0]))+1;
      selectedRows={};render();saveProject();
    }else{importCSV(e.target.result);}
  };r.readAsText(f);inp.value='';
}

function importCSV(content){
  var lines=content.split('\n');if(lines.length<2)return;
  // Comprehensive CSV header → field key mapping
  var map={
    'X':'','shot':'shotNo','shot #':'shotNo','shot#':'shotNo',
    'i/e d/n':'interior','инт/нат':'interior','i/e':'interior',
    'время суток':'timeOfDay','время':'timeOfDay',
    'размер кадра':'frame','кадр':'frame',
    'субъект':'subject','угол':'angle','линза':'lens',
    'оборудование':'equipment','оборуд.':'equipment','оборуд':'equipment',
    'движение камеры':'cameraMove','камера':'cameraMove',
    'действие':'action','заметки':'notes','заметки опер':'opNotes',
    'текст':'text','тайминг':'timing','тайминг трека':'timing',
    'локация':'location','storyboard':''
  };
  // Normalize headers
  var hdr=lines[0].split(',').map(function(x){return x.replace(/"/g,'').trim().toLowerCase();});
  var imported=[], skipped=0;
  for(var i=1;i<lines.length;i++){
    var cols=parseCSV(lines[i]);
    if(cols.length===0||(cols.length===1&&!cols[0])){skipped++;continue;}
    var r={id:nextId++,storyboard:[]};FIELDS.forEach(function(f){r[f]='';});
    var filled=false;
    for(var j=0;j<Math.min(cols.length,hdr.length);j++){
      var k=map[hdr[j]];
      if(!k)continue; // skip unmapped columns (X, Storyboard, etc)
      var val=(cols[j]||'').trim();
      if(!val)continue;
      // Split old combined I/E D/N into interior + timeOfDay
      if(k==='interior'&&val.includes(' ')){
        var parts=val.split(/\s+/);
        // First word is interior/exterior
        var first=parts[0].toLowerCase();
        if(first==='интерьер'||first==='натура'||first==='int'||first==='ext'||first==='инт'){
          r.interior=(first==='int'||first==='инт')?'интерьер':(first==='ext'?'натура':first);
          var rest=parts.slice(1).join(' ').toLowerCase();
          if(rest==='ночь'||rest==='night'||rest==='ноч')r.timeOfDay='ночь';
          else if(rest==='день'||rest==='day'||rest==='ден')r.timeOfDay='день';
          else if(rest==='вечер'||rest==='evening'||rest==='веч')r.timeOfDay='вечер';
          else if(rest==='утро'||rest==='morning'||rest==='утр')r.timeOfDay='утро';
          else r.timeOfDay=rest;
        }else{r[k]=val;}
      }else{r[k]=val;}
      filled=true;
    }
    if(filled)imported.push(r); else skipped++;
  }
  if(imported.length>0){
    var msg=imported.length+' сцен загружено'+(skipped>0?', '+skipped+' пустых пропущено':'')+'. Добавить к существующим?';
    if(rows.length>0&&confirm(msg)){rows=rows.concat(imported);}
    else{rows=imported;}
    selectedRows={};render();saveProject();
  }else{alert('Не найдено данных для импорта. Проверь CSV.');}
}
function parseCSV(line){var res=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===','){res.push(cur.trim());cur='';}else cur+=ch;}}res.push(cur.trim());return res;}

// ===== INIT =====
loadAll();loadProject();render();updateProjectSelector();
</script>
