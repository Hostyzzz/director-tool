<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎬 Режиссёрский сценарий</title>
<style>
  :root {
    --bg:#0a0a0a; --card:#121212; --border:#1e1e1e;
    --accent:#e94560; --gold:#f0a500; --green:#4ecca3;
    --text:#ddd; --muted:#777; --input-bg:#161616;
    --safe-top: env(safe-area-inset-top, 0);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    min-height:100vh; -webkit-tap-highlight-color:transparent;
    font-size:13px;
  }

  /* Toolbar */
  .tb {
    position:sticky; top:0; z-index:100;
    background:rgba(10,10,10,0.97); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:calc(8px + var(--safe-top)) 12px 8px;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  }
  .tb h1 { font-size:15px; font-weight:800; margin-right:auto; }
  .tb input.project { background:var(--input-bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 10px; font-size:12px; width:130px; outline:none; }
  .tb input.project:focus { border-color:var(--accent); }
  .btn {
    padding:7px 12px; border-radius:6px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:11px;
    font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .btn:active { background:#222; }
  .btn.a { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.g { background:var(--green); border-color:var(--green); color:#000; }
  .btn.s { padding:5px 8px; font-size:10px; }

  /* Table wrapper - scrollable */
  .tw { overflow-x:auto; padding:8px; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; min-width:100%; font-size:12px; }
  th, td {
    border:1px solid var(--border); padding:6px 8px;
    text-align:left; vertical-align:top; min-width:70px; max-width:200px;
  }
  th {
    background:var(--card); color:var(--muted); font-size:10px;
    text-transform:uppercase; letter-spacing:0.5px; position:sticky; top:90px; z-index:5;
    white-space:nowrap;
  }
  td input, td textarea, td select {
    width:100%; background:transparent; border:none; color:var(--text);
    font-size:12px; font-family:inherit; resize:vertical; padding:0; outline:none;
  }
  td textarea { min-height:40px; resize:none; }
  td select { appearance:none; cursor:pointer; }
  td input:focus, td textarea:focus, td select:focus { background:rgba(233,69,96,0.05); }
  td.row-num {
    text-align:center; font-weight:800; font-size:11px;
    color:var(--accent); min-width:32px; max-width:32px; padding:6px 2px;
  }
  td.row-actions { min-width:60px; max-width:60px; text-align:center; }
  td.row-actions button {
    padding:2px 6px; border-radius:3px; border:1px solid var(--border);
    background:var(--input-bg); color:var(--muted); cursor:pointer; font-size:10px;
    margin:1px;
  }
  td.row-actions button:active { color:var(--accent); border-color:var(--accent); }
  td.sb-cell { min-width:90px; max-width:120px; }
  .sb-thumbs { display:flex; gap:3px; flex-wrap:wrap; }
  .sb-thumb {
    width:36px; height:27px; border-radius:3px; border:1px solid var(--border);
    background:var(--input-bg); cursor:pointer; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted);
  }
  .sb-thumb img { width:100%; height:100%; object-fit:cover; }

  /* Hover highlight */
  tr:hover td { background:rgba(255,255,255,0.02); }

  /* Print */
  @media print {
    body { background:#fff; color:#000; }
    .tb, .row-actions, .sb-add-btn { display:none !important; }
    .tw { overflow:visible; padding:0; }
    table { font-size:10px; }
    th, td { border-color:#000; color:#000; padding:3px 5px; }
    th { background:#eee; }
    td input, td textarea, td select { color:#000; }
    @page { margin:10mm; size:A4 landscape; }
  }
</style>
</head>
<body>

<div class="tb">
  <h1>🎬 Сценарий</h1>
  <input class="project" id="pn" placeholder="Название" value="Суперсолдат">
  <button class="btn a" onclick="addRow()">+ Строка</button>
  <button class="btn" onclick="addRows(3)">+3</button>
  <button class="btn" onclick="addRows(10)">+10</button>
  <button class="btn g" onclick="exportCSV()">📥 CSV</button>
  <button class="btn s" onclick="exportJSON()">💾 JSON</button>
  <label class="btn s" style="cursor:pointer;">📂 Импорт <input type="file" accept=".csv,.json" style="display:none" onchange="loadFile(this)"></label>
  <button class="btn s" onclick="window.print()">🖨️ Печать</button>
  <span id="cnt" style="font-size:11px;color:var(--muted);margin-left:8px;"></span>
</div>

<div class="tw">
  <table id="t">
    <thead><tr>
      <th>#</th><th>SHOT</th><th>I/E D/N</th><th>Кадр</th><th>Субъект</th>
      <th>Угол</th><th>Линза</th><th>Оборуд.</th><th>Камера</th>
      <th>Действие</th><th>Заметки</th><th>Заметки ОПЕР</th><th>Текст</th>
      <th>Тайминг</th><th>Локация</th><th>🎬 Раскадровка</th><th></th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
var FIELDS = ['shotNo','ieDn','frame','subject','angle','lens','equipment','cameraMove',
  'action','notes','opNotes','text','timing','location'];
var SEL_FIELDS = {
  ieDn:['интерьер день','интерьер ночь','натура день','натура ночь','интерьер вечер'],
  angle:['прямой','низкий угол','верхний угол','рандом','с плеча','прямой на уровне глаз'],
  equipment:['РУКИ','ШТАТИВ','Стедикам','Слайдер','Кран','Дрон'],
  cameraMove:['статика','легкий наезд','легкий отъезд','панорама','рваная съемка','3 синхрона','x']
};

var rows = [];
var nextId = 1;

// ===== STORAGE =====
function save() {
  localStorage.setItem('dir_script', JSON.stringify({
    project: document.getElementById('pn').value, rows: rows, nextId: nextId
  }));
}
function load() {
  var r = localStorage.getItem('dir_script');
  if (!r) return false;
  var d = JSON.parse(r);
  rows = d.rows || []; nextId = d.nextId || 1;
  document.getElementById('pn').value = d.project || '';
  return true;
}

// ===== RENDER =====
function render() {
  var h = '';
  rows.forEach(function(r, i) {
    h += '<tr id="r-'+r.id+'">';
    h += '<td class="row-num">'+(i+1)+'</td>';
    FIELDS.forEach(function(f) {
      var v = r[f] || '';
      if (SEL_FIELDS[f]) {
        var opts = '<option value="">—</option>';
        SEL_FIELDS[f].forEach(function(o) {
          opts += '<option value="'+o+'"'+(o===v?' selected':'')+'>'+o+'</option>';
        });
        h += '<td><select onchange="upd('+r.id+',\''+f+'\',this.value)">'+opts+'</select></td>';
      } else if (f === 'action' || f === 'notes' || f === 'opNotes' || f === 'text') {
        h += '<td><textarea onchange="upd('+r.id+',\''+f+'\',this.value)" rows="2">'+esc(v)+'</textarea></td>';
      } else {
        h += '<td><input value="'+esc(v)+'" onchange="upd('+r.id+',\''+f+'\',this.value)"></td>';
      }
    });
    // Storyboard cell
    h += '<td class="sb-cell"><div class="sb-thumbs">';
    var sbs = r.storyboard || [];
    for (var si = 0; si < 3; si++) {
      var img = sbs[si] || '';
      h += '<div class="sb-thumb'+(img?'':' sb-add-btn')+'" onclick="addSB('+r.id+','+si+')">';
      h += img ? '<img src="'+img+'">' : '+';
      h += '</div>';
    }
    h += '</div></td>';
    // Actions
    h += '<td class="row-actions">';
    h += '<button onclick="dup('+i+')" title="Копия">⧉</button>';
    h += '<button onclick="del('+i+')" title="Удалить" style="color:var(--accent)">✕</button>';
    h += '</td>';
    h += '</tr>';
  });
  document.getElementById('tb').innerHTML = h;
  document.getElementById('cnt').textContent = rows.length + ' сцен';
  save();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== ACTIONS =====
function addRow() {
  var r = { id: nextId++, storyboard: [] };
  FIELDS.forEach(function(f){ r[f] = ''; });
  rows.push(r);
  render();
  // Scroll to bottom
  var el = document.getElementById('r-'+r.id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function addRows(n) {
  for (var i = 0; i < n; i++) addRow();
}

function upd(id, key, val) {
  var r = rows.find(function(x){ return x.id===id; });
  if (r) { r[key] = val; save(); }
}

function del(i) {
  if (!confirm('Удалить строку #'+(i+1)+'?')) return;
  rows.splice(i, 1); render();
}

function dup(i) {
  var r = JSON.parse(JSON.stringify(rows[i]));
  r.id = nextId++;
  rows.splice(i+1, 0, r); render();
}

// ===== STORYBOARD =====
function addSB(id, slot) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() {
    var f = inp.files[0]; if (!f) return;
    if (f.size > 500000) {
      resize(f, 600, function(u){ saveSB(id, slot, u); });
    } else {
      var fr = new FileReader();
      fr.onload = function(e){ saveSB(id, slot, e.target.result); };
      fr.readAsDataURL(f);
    }
  };
  inp.click();
}

function resize(file, max, cb) {
  var r = new FileReader();
  r.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w=img.width,h=img.height,ratio=Math.min(max/w,max/h);
      w=Math.round(w*ratio);h=Math.round(h*ratio);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.65));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function saveSB(id, slot, url) {
  var r = rows.find(function(x){ return x.id===id; });
  if (!r) return;
  if (!r.storyboard) r.storyboard = [];
  r.storyboard[slot] = url;
  render();
}

// ===== IMPORT/EXPORT =====
function exportCSV() {
  var header = ['SHOT','I/E D/N','Размер кадра','Субъект','Угол','Линза','Оборудование','Движение камеры','Действие','Заметки','Заметки ОПЕР','Текст','Тайминг','Локация'];
  var lines = [header.join(',')];
  rows.forEach(function(r) {
    var row = FIELDS.map(function(f){ return '"'+(r[f]||'').replace(/"/g,'""')+'"'; });
    lines.push(row.join(','));
  });
  download('\uFEFF'+lines.join('\n'), (document.getElementById('pn').value||'scenario')+'.csv', 'text/csv');
}

function exportJSON() {
  var d = { project: document.getElementById('pn').value, rows: rows };
  download(JSON.stringify(d,null,2), (document.getElementById('pn').value||'scenario')+'.json', 'application/json');
}

function download(content, name, type) {
  var b = new Blob([content], {type:type});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
}

function loadFile(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    if (f.name.endsWith('.json')) {
      var d = JSON.parse(e.target.result);
      document.getElementById('pn').value = d.project || '';
      rows = d.rows || [];
      nextId = Math.max.apply(null, rows.map(function(x){return x.id;}).concat([0]))+1;
      render();
    } else {
      importCSV(e.target.result);
    }
  };
  r.readAsText(f);
  inp.value = '';
}

function importCSV(content) {
  var lines = content.split('\n');
  if (lines.length < 2) return;
  var map = {'SHOT':'shotNo','I/E D/N':'ieDn','Размер кадра':'frame','Субъект':'subject',
    'Угол':'angle','Линза':'lens','Оборудование':'equipment','Движение камеры':'cameraMove',
    'Действие':'action','Заметки':'notes','Заметки ОПЕР':'opNotes','Текст':'text',
    'Тайминг':'timing','Локация':'location','SHOT #':'shotNo','Хронометраж':'timing'};
  var hdr = lines[0].split(',').map(function(x){ return x.replace(/"/g,'').trim(); });
  var imported = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = parseCSV(lines[i]);
    if (cols.length === 0) continue;
    var r = { id: nextId++, storyboard: [] };
    FIELDS.forEach(function(f){ r[f] = ''; });
    for (var j = 0; j < Math.min(cols.length, hdr.length); j++) {
      var key = map[hdr[j]]; if (key) r[key] = cols[j];
    }
    imported.push(r);
  }
  if (imported.length > 0) {
    if (rows.length > 0 && confirm('Добавить к существующим?')) {
      rows = rows.concat(imported);
    } else { rows = imported; }
    render();
  }
}

function parseCSV(line) {
  var res=[],cur='',q=false;
  for (var i=0;i<line.length;i++) {
    var ch=line[i];
    if (q) { if (ch==='"') { if (line[i+1]==='"') { cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if (ch==='"') q=true; else if (ch===',') { res.push(cur.trim()); cur=''; } else cur+=ch; }
  }
  res.push(cur.trim()); return res;
}

// Save project name
document.getElementById('pn').addEventListener('input', save);

// Init
if (!load()) { addRows(5); render(); } else { render(); }
</script>
</body>
</html>
