<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎬 Режиссёрский сценарий</title>
<style>
:root {
  --bg:#0a0a0a; --card:#121212; --border:#202020;
  --accent:#e94560; --gold:#f0a500; --green:#4ecca3;
  --text:#ddd; --muted:#777; --input:#161616;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:13px;-webkit-tap-highlight-color:transparent}

/* TOOLBAR */
.tb{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tb h1{font-size:14px;font-weight:800;margin-right:auto}
.tb select.project{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;min-width:140px;outline:none;cursor:pointer}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:active{background:#222}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#000}
.btn.s{padding:4px 7px;font-size:10px}
.btn.danger{color:var(--accent);border-color:var(--accent)}

/* CREW */
.crew{padding:10px 12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crew label{font-size:10px;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.crew input{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;width:140px;outline:none}
.crew input:focus{border-color:var(--accent)}

/* Row size controls */
.sz{padding:4px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sz span{font-size:10px;color:var(--muted)}
.sz input[type=range]{width:80px;accent-color:var(--accent)}

/* ===== TABLE CONTAINER ===== */
/* This is the key: separate scroll container so sticky thead works */
.twrap{position:relative;margin:0 8px 8px;max-height:calc(100vh - 160px);overflow:auto;border:1px solid var(--border);border-radius:4px}
table{border-collapse:collapse;min-width:max-content;font-size:12px;width:100%}
thead{position:sticky;top:0;z-index:10}
th,td{border:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:9px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;background:var(--card);color:var(--muted)}
td input,td textarea,td select{width:100%;background:transparent;border:none;color:var(--text);font-size:11px;font-family:inherit;padding:2px;outline:none}
td textarea{min-height:36px;resize:none}
td select{appearance:none;cursor:pointer;color:#000;background:var(--input);border-radius:4px;padding:4px 6px}
td select option{color:#000;background:#fff}
td input:focus,td textarea:focus,td select:focus{outline:1px solid var(--accent);outline-offset:-1px}

td.num{text-align:center;font-weight:800;font-size:11px;color:var(--accent);min-width:28px;padding:5px 2px}
td.chk{min-width:22px;width:22px;text-align:center;padding:4px 0}
td.chk input{width:14px;height:14px;accent-color:var(--accent)}
td.act{min-width:52px;text-align:center;white-space:nowrap}
td.act button{padding:2px 5px;border-radius:3px;border:1px solid var(--border);background:var(--input);color:var(--muted);cursor:pointer;font-size:9px;margin:1px}
td.act button:active{color:var(--accent)}

/* Color rows by I/E D/N */
tr.ie-int-night td{background:rgba(10,10,40,0.45)}
tr.ie-int-day td{background:rgba(15,35,15,0.35)}
tr.ie-ext-night td{background:rgba(5,10,40,0.55)}
tr.ie-ext-day td{background:rgba(40,25,10,0.35)}
tr.selected td{background:rgba(233,69,96,0.15)!important}

/* Storyboard cell */
td.sb{min-width:120px;width:160px}
.sb-zone{display:flex;flex-direction:column;gap:4px;min-height:60px}
.sb-slot{width:100%;min-height:80px;border:2px dashed var(--border);border-radius:6px;background:var(--input);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;position:relative;transition:.15s}
.sb-slot img{width:100%;height:auto;display:block}
.sb-slot.drag-over{border-color:var(--accent);background:rgba(233,69,96,0.1)}
.sb-slot .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center}
.sb-slot.has-img .del{display:flex}
.sb-slot:hover .del{display:flex}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:200;cursor:pointer}
.modal img{max-width:95vw;max-height:95vh;border-radius:8px}

/* Project menu */
.proj-actions{display:none;position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--border);border-radius:6px;z-index:50;min-width:160px;padding:4px}
.proj-actions button{display:block;width:100%;padding:6px 10px;background:transparent;border:none;color:var(--text);font-size:11px;cursor:pointer;text-align:left;font-family:inherit;border-radius:4px}
.proj-actions button:hover{background:rgba(255,255,255,0.05)}
.proj-actions button.danger{color:var(--accent)}
.proj-wrap{position:relative}

/* Print */
@media print{
  body{background:#fff;color:#000;font-size:9px}
  .tb,.crew,.sz,.act,.chk,.del,.sb-zone,.btn{display:none!important}
  .twrap{max-height:none;overflow:visible;border:none;margin:0}
  table{font-size:9px;width:100%}
  th,td{border-color:#000;color:#000;padding:2px 4px}
  th{background:#eee}
  td input,td textarea{color:#000}
  td select{color:#000;background:transparent;padding:0}
  tr td{background:transparent!important}
  td.sb{min-width:60px;width:80px}
  .sb-slot{min-height:40px}
  @page{margin:8mm;size:A4 landscape}
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="tb">
  <h1>🎬 Сценарий</h1>
  <div class="proj-wrap">
    <select class="project" id="projSel" onchange="switchProject(this.value)"></select>
    <div class="proj-actions" id="projActions">
      <button onclick="renameProject()">✏️ Переименовать</button>
      <button onclick="deleteProject()" class="danger">🗑 Удалить</button>
    </div>
  </div>
  <button class="btn a" onclick="addRow()">+ Строка</button>
  <button class="btn" onclick="addRows(3)">+3</button>
  <button class="btn" onclick="addRows(10)">+10</button>
  <button class="btn s" onclick="newProject()">🆕 Проект</button>
  <button class="btn g" onclick="exportCSV()">📥 CSV</button>
  <button class="btn s" onclick="exportJSON()">💾 JSON</button>
  <label class="btn s" style="cursor:pointer">📂 Импорт <input type="file" accept=".csv,.json" style="display:none" onchange="loadFile(this)"></label>
  <button class="btn s" onclick="window.print()">🖨️</button>
  <button class="btn danger s" onclick="delSelected()" id="delSel" style="display:none">✕ Удалить</button>
  <span id="cnt" style="font-size:11px;color:var(--muted);margin-left:4px"></span>
</div>

<!-- CREW -->
<div class="crew">
  <label>Режиссёр <input id="crDir" placeholder="Хахуза" oninput="saveMeta()"></label>
  <label>Оператор <input id="crOp" placeholder="Ярослав Савельев" oninput="saveMeta()"></label>
  <label>Продюсер <input id="crProd" placeholder="" oninput="saveMeta()"></label>
</div>

<!-- SIZE CONTROLS -->
<div class="sz">
  <span>Высота строк:</span><input type="range" min="20" max="200" value="60" id="rowH" oninput="setRowH(this.value)">
  <span id="rowHVal">60px</span>
  <span style="margin-left:12px">Ширина столбцов:</span><input type="range" min="40" max="200" value="80" id="colW" oninput="setColW(this.value)">
  <span id="colWVal">80px</span>
</div>

<!-- TABLE -->
<div class="twrap" id="twrap">
  <table>
    <thead><tr id="theadRow">
      <th style="width:22px;min-width:22px;max-width:22px"></th>
      <th style="width:28px;min-width:28px;max-width:28px">#</th>
      <th>SHOT</th>
      <th>I/E D/N</th>
      <th>Кадр</th>
      <th>Субъект</th>
      <th>Угол</th>
      <th>Линза</th>
      <th>Оборуд.</th>
      <th>Камера</th>
      <th>Действие</th>
      <th>Заметки</th>
      <th>Заметки ОПЕР</th>
      <th>Текст</th>
      <th>Тайминг</th>
      <th>Локация</th>
      <th>🎬 Раскадровка</th>
      <th></th>
    </tr></thead>
    <tbody id="tBody"></tbody>
  </table>
</div>

<script>
var FIELDS = ['shotNo','ieDn','frame','subject','angle','lens','equipment','cameraMove','action','notes','opNotes','text','timing','location'];
var SEL = {
  ieDn:['интерьер день','интерьер ночь','натура день','натура ночь','интерьер вечер','натура вечер'],
  angle:['прямой','низкий угол','верхний угол','рандом','с плеча','прямой на уровне глаз','субъективный'],
  equipment:['РУКИ','ШТАТИВ','Слайдер','Стабилизатор','Стедикам','Кран','Дрон','ГРИП'],
  // cameraMove — обычное текстовое поле, НЕ select
};

function rowIE(row) {
  var v = (row.ieDn||'').toLowerCase();
  if (v.includes('интерьер') && v.includes('ноч')) return 'ie-int-night';
  if (v.includes('интерьер') && v.includes('ден')) return 'ie-int-day';
  if (v.includes('натура') && v.includes('ноч')) return 'ie-ext-night';
  if (v.includes('натура') && v.includes('ден')) return 'ie-ext-day';
  if (v.includes('интерьер') && v.includes('веч')) return 'ie-int-night';
  if (v.includes('натура') && v.includes('веч')) return 'ie-ext-night';
  return '';
}

// Projects
var projects = {};
var currentProj = 'default';
var rows = [];
var nextId = 1;
var meta = { director:'', operator:'', producer:'' };
var rowHeight = 60;
var colWidth = 80;

// ===== STORAGE =====
function saveAll() {
  localStorage.setItem('dir_script_projects', JSON.stringify(projects));
  localStorage.setItem('dir_script_current', currentProj);
  localStorage.setItem('dir_script_rowH', rowHeight);
  localStorage.setItem('dir_script_colW', colWidth);
}
function loadAll() {
  var p = localStorage.getItem('dir_script_projects');
  if (p) projects = JSON.parse(p);
  currentProj = localStorage.getItem('dir_script_current') || 'default';
  if (!projects[currentProj]) projects[currentProj] = { rows:[], nextId:1, meta:{ director:'', operator:'', producer:'' } };
  rowHeight = parseInt(localStorage.getItem('dir_script_rowH')) || 60;
  colWidth = parseInt(localStorage.getItem('dir_script_colW')) || 80;
}
function loadProject() {
  var p = projects[currentProj];
  rows = p.rows || [];
  nextId = p.nextId || 1;
  meta = p.meta || { director:'', operator:'', producer:'' };
  document.getElementById('crDir').value = meta.director || '';
  document.getElementById('crOp').value = meta.operator || '';
  document.getElementById('crProd').value = meta.producer || '';
}
function saveProject() {
  projects[currentProj] = { rows:rows, nextId:nextId, meta:meta };
  saveAll();
}

function switchProject(name) {
  currentProj = name;
  localStorage.setItem('dir_script_current', name);
  loadProject();
  selectedRows = {};
  render();
  updateProjectSelector();
}
function newProject() {
  var name = prompt('Название нового проекта:');
  if (!name) return;
  if (projects[name]) { alert('Уже есть'); return; }
  projects[name] = { rows:[], nextId:1, meta:{ director:'', operator:'', producer:'' } };
  currentProj = name;
  localStorage.setItem('dir_script_current', name);
  loadProject();
  selectedRows = {};
  render();
  updateProjectSelector();
}
function renameProject() {
  var old = currentProj;
  var name = prompt('Новое название:', old);
  if (!name || name === old) return;
  if (projects[name]) { alert('Проект с таким названием уже есть'); return; }
  projects[name] = projects[old];
  delete projects[old];
  currentProj = name;
  localStorage.setItem('dir_script_current', name);
  saveAll();
  updateProjectSelector();
}
function deleteProject() {
  var keys = Object.keys(projects);
  if (keys.length <= 1) { alert('Нельзя удалить последний проект'); return; }
  if (!confirm('Удалить проект «'+currentProj+'»? Данные будут потеряны.')) return;
  delete projects[currentProj];
  currentProj = keys.find(function(k){ return k !== currentProj; });
  localStorage.setItem('dir_script_current', currentProj);
  saveAll();
  loadProject();
  selectedRows = {};
  render();
  updateProjectSelector();
}

function updateProjectSelector() {
  var sel = document.getElementById('projSel');
  sel.innerHTML = '';
  Object.keys(projects).forEach(function(k) {
    sel.innerHTML += '<option value="'+k+'"'+(k===currentProj?' selected':'')+'>'+k+'</option>';
  });
  // Add "new project" option at end
  sel.innerHTML += '<option value="__new__" style="color:var(--accent)">+ Новый проект</option>';
}

document.getElementById('projSel').addEventListener('change', function() {
  if (this.value === '__new__') {
    newProject();
  } else {
    switchProject(this.value);
  }
});

// Project context menu
document.getElementById('projSel').addEventListener('contextmenu', function(e) {
  e.preventDefault();
  var menu = document.getElementById('projActions');
  menu.style.display = 'block';
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('.proj-wrap')) document.getElementById('projActions').style.display = 'none';
});

function saveMeta() {
  meta.director = document.getElementById('crDir').value;
  meta.operator = document.getElementById('crOp').value;
  meta.producer = document.getElementById('crProd').value;
  saveProject();
}

// ===== SIZE =====
function setRowH(v) {
  rowHeight = parseInt(v);
  document.getElementById('rowHVal').textContent = v+'px';
  document.querySelectorAll('#tBody td textarea').forEach(function(t){ t.style.minHeight = v+'px'; });
  saveAll();
}
function setColW(v) {
  colWidth = parseInt(v);
  document.getElementById('colWVal').textContent = v+'px';
  var ths = document.querySelectorAll('#theadRow th');
  for (var i=2;i<ths.length-1;i++) { ths[i].style.width=colWidth+'px'; ths[i].style.minWidth=colWidth+'px'; }
  saveAll();
}

// ===== RENDER =====
var selectedRows = {};

function render() {
  var h = '';
  rows.forEach(function(r, i) {
    var cls = rowIE(r);
    if (selectedRows[r.id]) cls += ' selected';
    h += '<tr class="'+cls+'" id="r-'+r.id+'">';
    h += '<td class="chk"><input type="checkbox" onchange="toggleRow('+r.id+',event)"'+(selectedRows[r.id]?' checked':'')+'></td>';
    h += '<td class="num">'+(i+1)+'</td>';
    FIELDS.forEach(function(f) {
      var v = r[f] || '';
      if (SEL[f]) {
        var opts = '<option value="">—</option>';
        SEL[f].forEach(function(o) { opts += '<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>'; });
        h += '<td><select onchange="upd('+r.id+',\''+f+'\',this.value);recolor('+r.id+')">'+opts+'</select></td>';
      } else if (f === 'action' || f === 'notes' || f === 'opNotes' || f === 'text') {
        h += '<td><textarea onchange="upd('+r.id+',\''+f+'\',this.value)" rows="2" style="min-height:'+rowHeight+'px">'+esc(v)+'</textarea></td>';
      } else {
        h += '<td><input value="'+esc(v)+'" onchange="upd('+r.id+',\''+f+'\',this.value)"></td>';
      }
    });
    // Storyboard — one big slot + extras
    h += '<td class="sb"><div class="sb-zone">';
    var sbs = r.storyboard || [];
    // Filter out nulls
    var imgs = sbs.filter(function(x){ return !!x; });
    if (imgs.length === 0) imgs = [''];
    // Show all images
    imgs.forEach(function(img, si) {
      var realIdx = sbs.indexOf(img);
      if (realIdx < 0) realIdx = si;
      h += '<div class="sb-slot'+(img?' has-img':'')+'" id="sb-'+r.id+'-'+si+'"';
      h += ' ondragover="dOver(event)" ondragleave="event.currentTarget.classList.remove(\'drag-over\')" ondrop="dDrop(event,'+r.id+','+si+')">';
      if (img) {
        h += '<img src="'+img+'" onclick="viewImg(event,\''+img+'\')">';
        h += '<button class="del" onclick="event.stopPropagation();delSB('+r.id+','+si+')">✕</button>';
      } else {
        h += '<span onclick="addSB('+r.id+','+si+')">+</span>';
      }
      h += '</div>';
    });
    // Add empty slot for new drop
    h += '<div class="sb-slot" style="min-height:40px" id="sb-'+r.id+'-new"';
    h += ' ondragover="dOver(event)" ondragleave="event.currentTarget.classList.remove(\'drag-over\')" ondrop="dDropNew(event,'+r.id+')">';
    h += '<span onclick="addSBNew('+r.id+')">+</span></div>';
    h += '</div></td>';
    // Actions
    h += '<td class="act"><button onclick="dup('+i+')">⧉</button><button style="color:var(--accent)" onclick="del('+i+')">✕</button></td>';
    h += '</tr>';
  });
  document.getElementById('tBody').innerHTML = h;
  document.getElementById('cnt').textContent = rows.length + ' сцен';
  // Apply sizes
  setRowH(rowHeight);
  setColW(colWidth);
  updateDelSel();
}

function recolor(id) {
  var r = rows.find(function(x){ return x.id===id; });
  if (!r) return;
  var tr = document.getElementById('r-'+id);
  if (tr) { tr.className = rowIE(r) + (selectedRows[id]?' selected':''); }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== ROW ACTIONS =====
function addRow() {
  var r = { id: nextId++, storyboard: [] };
  FIELDS.forEach(function(f){ r[f] = ''; });
  rows.push(r);
  render();
  var el = document.getElementById('r-'+r.id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  saveProject();
}
function addRows(n) { for (var i=0;i<n;i++) addRow(); }
function upd(id, key, val) {
  var r = rows.find(function(x){ return x.id===id; });
  if (r) { r[key] = val; saveProject(); }
}
function del(i) {
  if (!confirm('Удалить строку #'+(i+1)+'?')) return;
  delete selectedRows[rows[i].id];
  rows.splice(i,1);
  render();
  saveProject();
}
function dup(i) {
  var r = JSON.parse(JSON.stringify(rows[i]));
  r.id = nextId++;
  rows.splice(i+1,0,r);
  render();
  saveProject();
}

// ===== MULTI-SELECT =====
function toggleRow(id, e) {
  if (e.target.checked) selectedRows[id] = true;
  else delete selectedRows[id];
  render();
}
function delSelected() {
  var ids = Object.keys(selectedRows);
  if (ids.length === 0) return;
  if (!confirm('Удалить '+ids.length+' выбранных строк?')) return;
  rows = rows.filter(function(r){ return !selectedRows[r.id]; });
  selectedRows = {};
  render();
  saveProject();
}
function updateDelSel() {
  var btn = document.getElementById('delSel');
  var n = Object.keys(selectedRows).length;
  btn.style.display = n > 0 ? '' : 'none';
  btn.textContent = '✕ '+n;
}

// ===== STORYBOARD =====
function addSB(id, si) { pickImg(function(u){ saveSB(id, si, u); }); }
function addSBNew(id) { pickImg(function(u){ addSBSlot(id, u); }); }

function pickImg(cb) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() { var f = inp.files[0]; if (f) processImg(f, cb); };
  inp.click();
}

function processImg(file, cb) {
  if (file.size > 800000) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w=img.width,h=img.height,ratio=Math.min(800/w,800/h);
        w=Math.round(w*ratio);h=Math.round(h*ratio);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  } else {
    var fr = new FileReader();
    fr.onload = function(e){ cb(e.target.result); };
    fr.readAsDataURL(file);
  }
}

function saveSB(id, si, url) {
  var r = rows.find(function(x){ return x.id===id; });
  if (!r) return;
  if (!r.storyboard) r.storyboard = [];
  // Clean nulls
  r.storyboard = r.storyboard.filter(function(x){ return !!x; });
  if (si >= r.storyboard.length) r.storyboard.push(url);
  else r.storyboard[si] = url;
  render();
  saveProject();
}

function addSBSlot(id, url) {
  var r = rows.find(function(x){ return x.id===id; });
  if (!r) return;
  if (!r.storyboard) r.storyboard = [];
  r.storyboard = r.storyboard.filter(function(x){ return !!x; });
  r.storyboard.push(url);
  render();
  saveProject();
}

function delSB(id, si) {
  var r = rows.find(function(x){ return x.id===id; });
  if (!r || !r.storyboard) return;
  r.storyboard = r.storyboard.filter(function(x){ return !!x; });
  r.storyboard.splice(si, 1);
  render();
  saveProject();
}

function viewImg(e, url) {
  e.stopPropagation();
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<img src="'+url+'">';
  m.onclick = function(){ m.remove(); };
  document.body.appendChild(m);
}

// Drag & drop
function dOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dDrop(e, id, si) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var f = e.dataTransfer.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  processImg(f, function(u){ saveSB(id, si, u); });
}
function dDropNew(e, id) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var f = e.dataTransfer.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  processImg(f, function(u){ addSBSlot(id, u); });
}

// ===== IMPORT/EXPORT =====
function exportCSV() {
  var hdr = ['SHOT','I/E D/N','Размер кадра','Субъект','Угол','Линза','Оборудование','Движение камеры','Действие','Заметки','Заметки ОПЕР','Текст','Тайминг','Локация'];
  var lines = [hdr.join(',')];
  rows.forEach(function(r) {
    lines.push(FIELDS.map(function(f){ return '"'+(r[f]||'').replace(/"/g,'""')+'"'; }).join(','));
  });
  dl('\uFEFF'+lines.join('\n'), currentProj+'.csv', 'text/csv');
}
function exportJSON() {
  dl(JSON.stringify({project:currentProj,meta:meta,rows:rows},null,2), currentProj+'.json', 'application/json');
}
function dl(content, name, type) {
  var b = new Blob([content], {type:type});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
}
function loadFile(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    if (f.name.endsWith('.json')) {
      var d = JSON.parse(e.target.result);
      if (d.project && d.project !== currentProj) {
        if (confirm('Импортировать как новый проект "'+d.project+'"?')) {
          projects[d.project] = { rows:d.rows||[], nextId:Math.max.apply(null,(d.rows||[]).map(function(x){return x.id}).concat([0]))+1, meta:d.meta||meta };
          currentProj = d.project;
          localStorage.setItem('dir_script_current', d.project);
          loadProject();
          selectedRows = {};
          render();
          updateProjectSelector();
          saveAll();
          return;
        }
      }
      meta = d.meta || meta;
      document.getElementById('crDir').value = meta.director || '';
      document.getElementById('crOp').value = meta.operator || '';
      document.getElementById('crProd').value = meta.producer || '';
      rows = d.rows || [];
      nextId = Math.max.apply(null,rows.map(function(x){return x.id}).concat([0]))+1;
      selectedRows = {};
      render();
      saveProject();
    } else { importCSV(e.target.result); }
  };
  r.readAsText(f);
  inp.value = '';
}
function importCSV(content) {
  var lines = content.split('\n');
  if (lines.length<2) return;
  var map = {'SHOT':'shotNo','SHOT #':'shotNo','I/E D/N':'ieDn','Размер кадра':'frame','Субъект':'subject',
    'Угол':'angle','Линза':'lens','Оборудование':'equipment','Оборуд.':'equipment','Движение камеры':'cameraMove',
    'Камера':'cameraMove','Действие':'action','Заметки':'notes','Заметки ОПЕР':'opNotes','Текст':'text',
    'Тайминг':'timing','тайминг трека':'timing','Локация':'location','локация':'location'};
  var hdr = lines[0].split(',').map(function(x){ return x.replace(/"/g,'').trim(); });
  var imported = [];
  for (var i=1;i<lines.length;i++) {
    var cols = parseCSV(lines[i]);
    if (cols.length===0||(cols.length===1&&!cols[0])) continue;
    var r = { id: nextId++, storyboard: [] };
    FIELDS.forEach(function(f){ r[f] = ''; });
    for (var j=0;j<Math.min(cols.length,hdr.length);j++) {
      var key = map[hdr[j]]; if (key) r[key] = cols[j];
    }
    if (cols[0] && /^\d+$/.test(cols[0].trim()) && !r.shotNo) r.shotNo = cols[0];
    imported.push(r);
  }
  if (imported.length>0) {
    if (rows.length>0 && confirm('Добавить к существующим?')) rows=rows.concat(imported);
    else rows=imported;
    selectedRows = {};
    render();
    saveProject();
  }
}
function parseCSV(line) {
  var res=[],cur='',q=false;
  for (var i=0;i<line.length;i++) {
    var ch=line[i];
    if (q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"';i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ res.push(cur.trim());cur=''; } else cur+=ch; }
  }
  res.push(cur.trim()); return res;
}

// ===== INIT =====
loadAll();
loadProject();
render();
updateProjectSelector();
